name: Apple TV app
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Also build, sign and upload to App Store Connect"
        type: boolean
        default: false
  push:
    paths: ["appletv/**", ".github/workflows/appletv.yml"]
permissions:
  contents: write
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "Using $X"
          sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && cd appletv && xcodegen generate
      - name: Build for Apple TV simulator
        run: |
          cd appletv
          xcodebuild -project WWORadioTV.xcodeproj -scheme WWORadioTV -sdk appletvsimulator \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Run and screenshot
        run: |
          cd appletv
          RT=$(xcrun simctl list runtimes tvOS -j | python3 -c "import sys,json;r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable']];print(r[-1]['identifier'])")
          DT=$(xcrun simctl list devicetypes -j | python3 -c "import sys,json;d=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'Apple-TV-4K' in x['identifier']];print(d[-1])")
          UDID=$(xcrun simctl create WWOTV "$DT" "$RT"); xcrun simctl boot $UDID; sleep 20
          APP=$(find build -name "WWO Radio.app" -path "*simulator*" | head -1)
          xcrun simctl install $UDID "$APP"
          xcrun simctl launch $UDID com.live365.weston; sleep 20
          mkdir -p ../out; xcrun simctl io $UDID screenshot ../out/appletv-home.png
      - uses: actions/upload-artifact@v4
        with: { name: appletv-screenshots, path: out }
      - name: Save screenshot to repo
        run: |
          mkdir -p appletv/screenshots && cp out/*.png appletv/screenshots/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add appletv/screenshots && git commit -m "Apple TV screenshot [skip ci]" && git push || echo "nothing to commit"

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    needs: simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: 2PDL2SLH62
      ASC_ISSUER_ID: f9dc55b5-de9b-438d-a519-4140ef7df4f6
      TEAM_ID: QY669LF7P8
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; xcodebuild -version
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          BODY=$(printf '%s' "$P8" | tr -d ' \r\n\t-' | sed -e 's/BEGINPRIVATEKEY//g' -e 's/ENDPRIVATEKEY//g' | tr -cd 'A-Za-z0-9+/=')
          echo "Secret length: ${#P8}, key body length: ${#BODY}, has BEGIN line: $(printf '%s' "$P8" | grep -c 'BEGIN PRIVATE KEY')"
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          openssl pkey -in ~/private_keys/AuthKey_$ASC_KEY_ID.p8 -noout && echo "Key file is valid"
      - name: Generate project
        run: brew install xcodegen && cd appletv && xcodegen generate
      - name: Archive
        run: |
          cd appletv
          xcodebuild -project WWORadioTV.xcodeproj -scheme WWORadioTV -sdk appletvos -configuration Release \
            -archivePath build/WWORadioTV.xcarchive archive \
            DEVELOPMENT_TEAM=$TEAM_ID CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID | tail -40
      - name: Upload to App Store Connect
        run: |
          cd appletv
          cat > ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/WWORadioTV.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
